name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    name: Zig and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Enable compiler crash diagnostics
        run: sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/vivi-zig-core.%p"

      - name: Check Zig and CLI
        run: |
          ulimit -c unlimited
          ./scripts/check-zig.sh

      - name: Report compiler crash backtrace
        if: failure()
        run: |
          for core in "$RUNNER_TEMP"/vivi-zig-core.*; do
            [ -f "$core" ] || continue
            if ! command -v gdb >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends gdb
            fi
            gdb --batch \
              -ex "set print frame-arguments none" \
              -ex "thread apply all bt" \
              "$(command -v zig)" "$core"
          done

      - name: Compare compiler crash with LLVM
        if: failure()
        run: |
          for core in "$RUNNER_TEMP"/vivi-zig-core.*; do
            [ -f "$core" ] || continue
            ./scripts/check-zig.sh -Dllvm=true
            break
          done

  c-api-cross:
    name: C API cross-builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Cross-build C API
        run: ./scripts/check-c-api-cross.sh

  macos:
    name: macOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check macOS app
        run: ./scripts/check-macos.sh
