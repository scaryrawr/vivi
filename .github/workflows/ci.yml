name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run check

  windows:
    name: Windows CLI
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run check

  macos:
    name: macOS CLI
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    name: Build ${{ matrix.name }}
    needs: [check, windows, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            target: bun-linux-x64-baseline
            artifact: vivi-linux-x86_64
            output: vivi
          - name: macOS ARM64
            target: bun-darwin-arm64
            artifact: vivi-macos-arm64
            output: vivi
          - name: Windows x86_64
            target: bun-windows-x64-baseline
            artifact: vivi-windows-x86_64
            output: vivi.exe
          - name: Windows ARM64
            target: bun-windows-arm64
            artifact: vivi-windows-arm64
            output: vivi.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - name: Build executable
        run: >-
          bun run scripts/build.ts
          --target=${{ matrix.target }}
          --outfile=release/${{ matrix.artifact }}/${{ matrix.output }}
          --version=${GITHUB_REF_NAME#v}

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}/${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        id: download-artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9

      - name: Package release archives
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          dl="${{ steps.download-artifacts.outputs.download-path }}"
          assets="${GITHUB_WORKSPACE}/release-assets"
          mkdir -p "$assets"
          chmod +x "$dl/vivi-linux-x86_64/vivi" "$dl/vivi-macos-arm64/vivi"
          zip -qj "$assets/vivi-${version}-linux-x86_64.zip" "$dl/vivi-linux-x86_64/vivi"
          zip -qj "$assets/vivi-${version}-macos-arm64.zip" "$dl/vivi-macos-arm64/vivi"
          zip -qj "$assets/vivi-${version}-windows-x86_64.zip" "$dl/vivi-windows-x86_64/vivi.exe"
          zip -qj "$assets/vivi-${version}-windows-arm64.zip" "$dl/vivi-windows-arm64/vivi.exe"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (2.6.2)
        with:
          prerelease: ${{ contains(github.ref, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.zip
