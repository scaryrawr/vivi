name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript scaffold
        run: bun run check

  linux:
    name: Linux CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check Zig and CLI
        run: ./scripts/check-zig.sh

      - name: Build release CLI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          zig build \
              -Dtarget=x86_64-linux-gnu.2.17 \
              -Doptimize=ReleaseSafe \
              -Dversion="${GITHUB_REF_NAME#v}"

      - name: Upload Linux CLI artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vivi-linux-x86_64
          path: zig-out/bin/vivi
          if-no-files-found: error

  windows:
    name: Windows CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build Windows CLIs
        run: |
          zig build \
              -Dtarget=x86_64-windows-gnu \
              -Doptimize=ReleaseSafe \
              -Dversion="${GITHUB_REF_NAME#v}" \
              --prefix zig-out/cli/windows-x86_64
          zig build \
              -Dtarget=aarch64-windows-gnu \
              -Doptimize=ReleaseSafe \
              -Dversion="${GITHUB_REF_NAME#v}" \
              --prefix zig-out/cli/windows-aarch64

      - name: Upload Windows CLI artifact (x86_64)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vivi-windows-x86_64
          path: zig-out/cli/windows-x86_64/bin/vivi.exe
          if-no-files-found: error

      - name: Upload Windows CLI artifact (ARM64)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vivi-windows-aarch64
          path: zig-out/cli/windows-aarch64/bin/vivi.exe
          if-no-files-found: error

  macos:
    name: macOS CLI
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check Zig and CLI
        run: ./scripts/check-zig.sh

      - name: Build release CLI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          sdk_path=$(xcrun --sdk macosx --show-sdk-path)
          zig build \
              --sysroot "$sdk_path" \
              -Dmacos-sdk="$sdk_path" \
              -Dtarget=aarch64-macos.14.0 \
              -Doptimize=ReleaseSafe \
              -Dversion="${GITHUB_REF_NAME#v}"

      - name: Upload macOS CLI artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vivi-macos-arm64
          path: zig-out/bin/vivi
          if-no-files-found: error

  release:
    name: Release
    needs: [linux, windows, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        id: download-artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9

      - name: Package release archives
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          dl="${{ steps.download-artifacts.outputs.download-path }}"
          assets="${GITHUB_WORKSPACE}/release-assets"
          mkdir -p "$assets"
          chmod +x "$dl/vivi-linux-x86_64/vivi" "$dl/vivi-macos-arm64/vivi"
          zip -qj "$assets/vivi-${version}-linux-x86_64.zip" "$dl/vivi-linux-x86_64/vivi"
          zip -qj "$assets/vivi-${version}-macos-arm64.zip" "$dl/vivi-macos-arm64/vivi"
          zip -qj "$assets/vivi-${version}-windows-x86_64.zip" "$dl/vivi-windows-x86_64/vivi.exe"
          zip -qj "$assets/vivi-${version}-windows-aarch64.zip" "$dl/vivi-windows-aarch64/vivi.exe"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (2.6.2)
        with:
          prerelease: ${{ contains(github.ref, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.zip
