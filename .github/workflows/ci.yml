name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    name: Zig and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check Zig and CLI
        run: ./scripts/check-zig.sh

      - name: Build Release CLI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: zig build -Doptimize=ReleaseSafe -Dversion="${GITHUB_REF_NAME#v}"

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vivi-linux-x86_64
          path: zig-out/bin/vivi
          if-no-files-found: error

  c-api-cross:
    name: C API cross-builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Cross-build C API
        run: ./scripts/check-c-api-cross.sh

      - name: Package Release Windows C API
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          zig build install-c-api \
              -Dtarget=x86_64-windows-msvc \
              -Dbackend-linkage=dynamic \
              -Doptimize=ReleaseSafe \
              -Dversion="${GITHUB_REF_NAME#v}" \
              --prefix zig-out/cross/windows-x86_64-release

      - name: Package Release Windows ARM64 C API
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          zig build install-c-api \
              -Dtarget=aarch64-windows-msvc \
              -Dbackend-linkage=dynamic \
              -Doptimize=ReleaseSafe \
              -Dversion="${GITHUB_REF_NAME#v}" \
              --prefix zig-out/cross/windows-aarch64-release

      - name: Upload Linux C API artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vivi-linux-x86_64-capi
          path: zig-out/cross/linux-x86_64/
          if-no-files-found: error

      - name: Upload Windows C API artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vivi-windows-x86_64
          path: zig-out/cross/windows-x86_64-release/
          if-no-files-found: error

      - name: Upload Windows ARM64 C API artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vivi-windows-aarch64
          path: zig-out/cross/windows-aarch64-release/
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build CLI and macOS app
        run: |
          zig build
          ./scripts/check-macos.sh

      - name: Build Release CLI
        run: zig build -Doptimize=ReleaseSafe

      - name: Upload macOS CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vivi-macos-arm64
          path: zig-out/bin/vivi
          if-no-files-found: error

  release:
    name: Release
    needs: [zig, c-api-cross, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        id: download-artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9

      - name: Package release archives
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          dl="${{ steps.download-artifacts.outputs.download-path }}"
          assets="${GITHUB_WORKSPACE}/release-assets"
          rm -rf "$assets"
          mkdir -p "$assets"
          zip -qj "$assets/vivi-${version}-linux-x86_64.zip" "$dl/vivi-linux-x86_64/vivi"
          zip -qj "$assets/vivi-${version}-macos-arm64.zip" "$dl/vivi-macos-arm64/vivi"
          (cd "$dl/vivi-windows-x86_64" && zip -qr "$assets/vivi-${version}-windows-x86_64.zip" bin include lib)
          (cd "$dl/vivi-windows-aarch64" && zip -qr "$assets/vivi-${version}-windows-aarch64.zip" bin include lib)
          ls -l "$assets"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (2.6.2)
        with:
          prerelease: ${{ contains(github.ref, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.zip
