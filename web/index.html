<!doctype html>
<html lang="en">
  <head>
    <!--
      THESIS: Vivi is a focused project conversation workspace, not a browser dashboard; ordered sessions and the active exchange are the whole surface.
      OWN-WORLD: macOS system typography, graphite materials, hairline separators, compact rows, and one restrained blue selection accent.
      STORY: Choose a project conversation, read its answer and activity in sequence, then continue from a composer that stays close to the work.
      FIRST VIEWPORT: A narrow project/session rail, quiet title toolbar, full-height transcript, and anchored multiline composer fill one desktop window.
      FORM: Operate mode, native productivity split view, pinned by the migration brief; no concept seed was needed.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Vivi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
